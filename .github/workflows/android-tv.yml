name: Build Album CRT Android TV APK
on:
  push:
    branches: [feature/android-tv]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: sdkmanager 'platforms;android-35'
      - run: gradle -p android-tv assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Album-CRT-TV
          path: android-tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
