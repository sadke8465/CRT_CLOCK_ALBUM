<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRT • WiiM connection test</title>
<style>body{background:#101010;color:#eee;font:18px system-ui;margin:24px}main{max-width:760px;margin:auto}h1{font-size:28px}input,button{font:inherit;padding:12px;border:1px solid #666;border-radius:8px;background:#242424;color:white}button{cursor:pointer}[hidden]{display:none!important}img{width:min(50vw,280px);display:block;margin:12px 0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:#bbb}.status{color:#9de5b5}label{display:block;margin-bottom:8px}</style></head>
<body><main><h1>WiiM connection test</h1><p>Automatic local playback diagnostic • v2 • Nothing is uploaded.</p><div id="controls"><label for="host">WiiM local IPv4 address</label><input id="host" inputmode="decimal" placeholder="192.168.1.108"><button id="start">Connect</button> <button id="stop">Stop</button></div><p class="status" id="result">Not connected</p><p id="details"></p><img id="art" alt="Current WiiM artwork" hidden><p id="image-status"></p><pre id="raw"></pre></main>
<script>
const el=id=>document.getElementById(id);
el('host').value=new URLSearchParams(location.search).get('ip')||'';
let running=false, serial=0, timer, previous='', controller;
const clean=v=>typeof v==='string'&&!/^(unknow|unknown|null|n\/a)$/i.test(v.trim())?v.trim():'';
function classify(s,m){
 if(s.status!=='play')return 'Idle';
 if(String(s.mode)!=='1')return 'Other input';
 if(/^(radio\s*88\s*fm|kan\s*88|כאן\s*88)$/i.test(clean(m.title)))return 'Kan 88 • radio metadata needed';
 if(clean(m.title)&&clean(m.artist)&&clean(m.album))return 'Music';
 return 'Ignored • incomplete music metadata';
}
function localIPv4(v){const p=v.split('.');return p.length===4&&p.every(x=>/^\d{1,3}$/.test(x)&&Number(x)<=255)&&(p[0]==='10'||(p[0]==='192'&&p[1]==='168')||(p[0]==='172'&&Number(p[1])>=16&&Number(p[1])<=31));}
function stop(){running=false;serial++;clearTimeout(timer);if(controller)controller.abort();previous='';el('art').hidden=true;el('image-status').textContent='';}
async function poll(host,id){
 if(!running||id!==serial)return;
 controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),5000);
 const base='https://'+host;
 async function api(cmd){const r=await fetch(base+'/httpapi.asp?command='+cmd,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
 try{
  const [s,d]=await Promise.all([api('getPlayerStatus'),api('getMetaInfo')]);if(id!==serial)return;
  const m=d.metaData||{}, mode=classify(s,m);
  el('result').textContent='Connected • '+mode+' • '+new Date().toLocaleTimeString();
  el('details').textContent=[clean(m.title),clean(m.artist),clean(m.album)].filter(Boolean).join(' — ');
  el('raw').textContent=JSON.stringify({status:s,metadata:m},null,2);
  const key=[m.title,m.artist,m.album,m.albumArtURI].join('|');
  if(mode==='Music'&&key!==previous){
   previous=key;const url=new URL(m.albumArtURI||'/data/AirplayArtWorkData.jpeg',base);
   if(url.origin!==base)throw Error('Artwork is outside WiiM origin');
   url.searchParams.set('t',Date.now());el('art').hidden=false;el('image-status').textContent='Loading artwork…';el('art').src=url.href;
  }else if(mode!=='Music'){previous='';el('art').hidden=true;el('image-status').textContent='';}
 }catch(e){if(id!==serial)return;el('result').textContent='Connection failed: '+e.message;el('raw').textContent='Browser may block local network access, cross-origin requests, or an untrusted device certificate. A local bridge may be required.';el('details').textContent='';el('art').hidden=true;previous='';}
 finally{clearTimeout(timeout);if(running&&id===serial)timer=setTimeout(()=>poll(host,id),1000);}
}
el('art').onload=()=>{el('image-status').textContent='Artwork loaded';};
el('art').onerror=()=>{el('image-status').textContent='Artwork blocked or unavailable';previous='';};
el('start').onclick=()=>{stop();const host=el('host').value.trim();if(!localIPv4(host)){el('result').textContent='Enter a valid private IPv4 address';return;}running=true;el('result').textContent='Connecting…';poll(host,serial);};
el('stop').onclick=()=>{stop();el('result').textContent='Stopped';};
if(localIPv4(el('host').value)){el('controls').hidden=true;el('start').click();}
</script></body></html>
