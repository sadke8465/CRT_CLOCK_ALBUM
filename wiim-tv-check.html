<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WiiM TV Check</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:white;font: bold 7vw Arial,sans-serif;text-align:center}main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:8vw}h1{font-size:12vw;margin:0;line-height:1.05}p{font-size:5vw;margin:3vh 0}body.ok h1{color:#83ff93}body.fail h1{color:#ff6868}</style></head><body><main><p>WIIM TV CHECK</p><h1 id="status">TESTING</h1><p id="details">Connecting…</p></main><script>
const host='192.168.1.108';
const status=document.getElementById('status'),details=document.getElementById('details');
async function poll(){const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);try{const r=await fetch('https://'+host+'/httpapi.asp?command=getMetaInfo',{signal:c.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.body.className='ok';status.textContent='CONNECTED';details.textContent=d.metaData?.title||'Metadata received';}catch(e){document.body.className='fail';status.textContent='FAILED';details.textContent='WiiM API unavailable';}finally{clearTimeout(t);setTimeout(poll,2000);}}poll();
</script></body></html>
